<svg viewBox="0 0 860 500" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Roboto, system-ui, sans-serif">
  <!-- Background -->
  <rect width="860" height="500" fill="#111827"/>

  <!-- Title -->
  <text x="430" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#F9FAFB">Esquema Zod — Definición y flujo de validación</text>

  <!-- === LEFT COLUMN: SCHEMA DEFINITION === -->
  <rect x="30" y="56" width="380" height="290" rx="10" fill="#1A2744" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="220" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#93C5FD">src/schemas/itemSchema.ts</text>

  <!-- Code block -->
  <rect x="46" y="88" width="348" height="244" rx="6" fill="#0F172A"/>
  <text x="62" y="110" font-family="Consolas, Menlo, monospace" font-size="10" fill="#F9FAFB" xml:space="preserve"><tspan fill="#60A5FA">import</tspan> { z } <tspan fill="#60A5FA">from</tspan> <tspan fill="#86EFAC">'zod'</tspan></text>

  <text x="62" y="132" font-family="Consolas, Menlo, monospace" font-size="10" fill="#F9FAFB" xml:space="preserve"><tspan fill="#60A5FA">export const</tspan> <tspan fill="#FCD34D">itemSchema</tspan> = z.object({</text>

  <text x="78" y="152" font-family="Consolas, Menlo, monospace" font-size="10" fill="#F9FAFB" xml:space="preserve">title: <tspan fill="#A78BFA">z.string()</tspan>.min(1, <tspan fill="#86EFAC">'Requerido'</tspan>),</text>

  <text x="78" y="170" font-family="Consolas, Menlo, monospace" font-size="10" fill="#F9FAFB" xml:space="preserve">email: <tspan fill="#A78BFA">z.string()</tspan>.email(<tspan fill="#86EFAC">'Email inválido'</tspan>),</text>

  <text x="78" y="188" font-family="Consolas, Menlo, monospace" font-size="10" fill="#F9FAFB" xml:space="preserve">price: <tspan fill="#A78BFA">z.coerce.number()</tspan>.positive(<tspan fill="#86EFAC">'&gt; 0'</tspan>),</text>

  <text x="78" y="206" font-family="Consolas, Menlo, monospace" font-size="10" fill="#F9FAFB" xml:space="preserve">notes: <tspan fill="#A78BFA">z.string()</tspan>.optional(),</text>

  <text x="62" y="224" font-family="Consolas, Menlo, monospace" font-size="10" fill="#F9FAFB" xml:space="preserve">});</text>

  <text x="62" y="250" font-family="Consolas, Menlo, monospace" font-size="10" fill="#F9FAFB" xml:space="preserve"><tspan fill="#60A5FA">export type</tspan> <tspan fill="#FCD34D">ItemFormData</tspan> = <tspan fill="#A78BFA">z.infer</tspan>&lt;typeof <tspan fill="#FCD34D">itemSchema</tspan>&gt;</text>

  <!-- Type note -->
  <rect x="62" y="263" width="320" height="24" rx="4" fill="#1E3A1A"/>
  <text x="222" y="280" text-anchor="middle" font-size="10" fill="#86EFAC">// ↑ tipo generado automáticamente — sin interfaz duplicada</text>

  <!-- === RIGHT COLUMN: USAGE === -->
  <rect x="450" y="56" width="380" height="290" rx="10" fill="#1A1A2E" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="640" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#C4B5FD">CreateScreen.tsx</text>

  <rect x="466" y="88" width="348" height="244" rx="6" fill="#0F172A"/>
  <text x="482" y="110" font-family="Consolas, Menlo, monospace" font-size="10" fill="#F9FAFB" xml:space="preserve"><tspan fill="#60A5FA">import</tspan> { zodResolver } <tspan fill="#60A5FA">from</tspan> <tspan fill="#86EFAC">'@hookform/resolvers/zod'</tspan></text>

  <text x="482" y="130" font-family="Consolas, Menlo, monospace" font-size="10" fill="#F9FAFB" xml:space="preserve"><tspan fill="#60A5FA">import</tspan> { itemSchema, type ItemFormData }</text>

  <text x="482" y="154" font-family="Consolas, Menlo, monospace" font-size="10" fill="#F9FAFB" xml:space="preserve"><tspan fill="#60A5FA">const</tspan> { control, handleSubmit,</text>
  <text x="498" y="170" font-family="Consolas, Menlo, monospace" font-size="10" fill="#F9FAFB" xml:space="preserve">formState: { errors, isSubmitting }</text>
  <text x="482" y="186" font-family="Consolas, Menlo, monospace" font-size="10" fill="#F9FAFB" xml:space="preserve">} = <tspan fill="#FCD34D">useForm</tspan>&lt;<tspan fill="#FCD34D">ItemFormData</tspan>&gt;({</text>

  <text x="498" y="204" font-family="Consolas, Menlo, monospace" font-size="10" fill="#F9FAFB" xml:space="preserve"><tspan fill="#60A5FA">resolver:</tspan> <tspan fill="#A78BFA">zodResolver</tspan>(<tspan fill="#FCD34D">itemSchema</tspan>),</text>
  <text x="482" y="221" font-family="Consolas, Menlo, monospace" font-size="10" fill="#F9FAFB">});</text>

  <text x="482" y="237" font-family="Consolas, Menlo, monospace" font-size="10" fill="#F9FAFB" xml:space="preserve">// errors.title?.message → string | undefined</text>

  <!-- Error example -->
  <rect x="482" y="242" width="316" height="38" rx="4" fill="#1C1917"/>
  <text x="640" y="258" text-anchor="middle" font-size="10.5" fill="#FCA5A5">errors.title &amp;&amp; (</text>
  <text x="640" y="272" text-anchor="middle" font-size="10.5" fill="#FCA5A5">&lt;Text&gt;{errors.title.message}&lt;/Text&gt;</text>

  <!-- Arrow connecting schema to screen -->
  <path d="M410 210 L450 210" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowV)"/>
  <text x="430" y="204" text-anchor="middle" font-size="9" fill="#A78BFA">import</text>

  <!-- === BOTTOM: Validation flow cards === -->
  <!-- Valid path -->
  <rect x="30" y="368" width="240" height="112" rx="8" fill="#14532D" stroke="#22C55E" stroke-width="1.5"/>
  <text x="150" y="390" text-anchor="middle" font-size="12" font-weight="700" fill="#86EFAC">✓ Validación exitosa</text>
  <text x="150" y="410" text-anchor="middle" font-size="10.5" fill="#4ADE80">handleSubmit llama onSubmit(data)</text>
  <text x="150" y="428" text-anchor="middle" font-size="10.5" fill="#4ADE80">data está tipado como ItemFormData</text>
  <text x="150" y="446" text-anchor="middle" font-size="10.5" fill="#4ADE80">price ya es un number (no string)</text>
  <text x="150" y="464" text-anchor="middle" font-size="10.5" fill="#4ADE80">gracias a z.coerce.number()</text>

  <!-- Invalid path -->
  <rect x="310" y="368" width="240" height="112" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="1.5"/>
  <text x="430" y="390" text-anchor="middle" font-size="12" font-weight="700" fill="#FCA5A5">✗ Validación fallida</text>
  <text x="430" y="410" text-anchor="middle" font-size="10.5" fill="#F87171">handleSubmit NO llama onSubmit</text>
  <text x="430" y="428" text-anchor="middle" font-size="10.5" fill="#F87171">errors.campo.message poblado</text>
  <text x="430" y="446" text-anchor="middle" font-size="10.5" fill="#F87171">TextInput muestra inputError style</text>
  <text x="430" y="464" text-anchor="middle" font-size="10.5" fill="#F87171">Mensaje visible bajo el campo</text>

  <!-- z.coerce note -->
  <rect x="590" y="368" width="240" height="112" rx="8" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="710" y="390" text-anchor="middle" font-size="12" font-weight="700" fill="#FCD34D">z.coerce.number()</text>
  <text x="710" y="410" text-anchor="middle" font-size="10.5" fill="#FDE68A">TextInput → siempre string</text>
  <text x="710" y="428" text-anchor="middle" font-size="10.5" fill="#FDE68A">z.coerce convierte antes</text>
  <text x="710" y="446" text-anchor="middle" font-size="10.5" fill="#FDE68A">de validar el valor</text>
  <text x="710" y="464" text-anchor="middle" font-size="10.5" fill="#FDE68A">sin coerce → TypeScript error</text>

  <defs>
    <marker id="arrowV" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8B5CF6"/>
    </marker>
  </defs>
</svg>
